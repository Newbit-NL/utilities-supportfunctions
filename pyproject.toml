[project]
name = "supportfunctions"
version = "0.1.33"
description = "Shared utility functions for internal projects"
authors = [
    { name = "Jeroen Vester", email = "jevester.work@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "azure-identity>=1.15",
    "azure-keyvault-secrets>=4.7"
]

# Build system (verplicht)
[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

# (optioneel) setuptools configuratie
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
