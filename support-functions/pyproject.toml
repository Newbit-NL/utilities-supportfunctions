[project]
name = "support-functions"
version = "0.1.0"
description = "Shared utility functions for internal projects"
authors = [
    { name = "Jeroen Vester", email = "jevester.work@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<2.0",
    "pyodbc>=4.0,<5.0",
    "PyYAML>=6.0,<7.0"
]

[project.optional-dependencies]
azure = [
    "azure-identity>=1.15,<2.0",
    "azure-keyvault-secrets>=4.7,<5.0"
]

# Build system (verplicht)
[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

# (optioneel) setuptools configuratie
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]